name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Compile Python
        run: python -m compileall -q -x "/\.venv/" .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check extension
        run: |
          for f in extension/*.js; do node --check "$f"; done
          node -e 'const m = require("./extension/manifest.json"); if (m.manifest_version !== 3) throw new Error("manifest_version must be 3")'

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: install.bat and native host smoke test
        shell: cmd
        run: |
          call install.bat < nul
          if errorlevel 1 exit /b 1
          reg query "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.yt_tab_downloader.helper" || exit /b 1
          .venv\Scripts\python.exe tests\native_smoke.py

      - name: Stop the helper
        if: always()
        shell: pwsh
        run: Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*server.py*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
