name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Compile Python
        run: python -m compileall -q -x "/\.venv/" .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check extension
        run: |
          for f in extension/*.js; do node --check "$f"; done
          node -e 'const m = require("./extension/manifest.json"); if (m.manifest_version !== 3) throw new Error("manifest_version must be 3")'

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: install.bat and native host smoke test
        shell: cmd
        run: |
          call install.bat < nul
          if errorlevel 1 exit /b 1
          reg query "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.yt_tab_downloader.helper" || exit /b 1
          reg query "HKCU\Software\Microsoft\Edge\NativeMessagingHosts\com.yt_tab_downloader.helper" || exit /b 1
          .venv\Scripts\python.exe tests\native_smoke.py


      - name: Standalone helper build and smoke test
        shell: cmd
        run: |
          pip install -r requirements-build.txt
          python scripts\build_helper.py dist\helper
          if errorlevel 1 exit /b 1
          python tests\native_smoke.py dist\helper\native_host.exe
          if errorlevel 1 exit /b 1
          dist\helper\native_host.exe install edge
          if errorlevel 1 exit /b 1
          reg query "HKCU\Software\Microsoft\Edge\NativeMessagingHosts\com.yt_tab_downloader.helper" || exit /b 1
          type dist\helper\com.yt_tab_downloader.helper.json
          findstr /c:"native_host.exe" dist\helper\com.yt_tab_downloader.helper.json || exit /b 1

      - name: Installer build, silent install and uninstall
        shell: cmd
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" choco install innosetup -y --no-progress
          "%ISCC%" /Q /DAppVersion=0.0.0-ci /DHelperDir=..\dist\helper installer\yt-media-harvester.iss
          if errorlevel 1 exit /b 1
          dist\helper\native_host.exe uninstall
          set "APP=%LOCALAPPDATA%\Programs\YT Media Harvester"
          start /wait "" dist\YT-Media-Harvester-Setup-0.0.0-ci.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="chrome,edge"
          if errorlevel 1 exit /b 1
          reg query "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.yt_tab_downloader.helper" || exit /b 1
          reg query "HKCU\Software\Microsoft\Edge\NativeMessagingHosts\com.yt_tab_downloader.helper" || exit /b 1
          reg query "HKCU\Software\BraveSoftware\Brave-Browser\NativeMessagingHosts\com.yt_tab_downloader.helper" && exit /b 1
          type "%APP%\com.yt_tab_downloader.helper.json"
          findstr /c:"YT Media Harvester" "%APP%\com.yt_tab_downloader.helper.json" || exit /b 1
          findstr /c:"native_host.exe" "%APP%\com.yt_tab_downloader.helper.json" || exit /b 1
          python tests\native_smoke.py "%APP%\native_host.exe"
          if errorlevel 1 exit /b 1
          start /wait "" "%APP%\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          rem The uninstaller hands off to a copy of itself in TEMP, so wait for the key to go.
          for /l %%i in (1,1,30) do (
            reg query "HKCU\Software\Microsoft\Edge\NativeMessagingHosts\com.yt_tab_downloader.helper" >nul 2>&1 || exit /b 0
            ping -n 2 127.0.0.1 >nul
          )
          echo Uninstall left the Edge registry key behind
          exit /b 1
